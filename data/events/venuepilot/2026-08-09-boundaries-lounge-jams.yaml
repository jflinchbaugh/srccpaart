description: <p>Every second Sunday of the month at 3 PM</p><p>The Boundary Lounge is a space for musicians who want to explore musicality in a collaborative group jamming environment. The emphasis is on relaxed Sunday afternoon lounge vibes; Collaborative jamming, jazz standards, and musical experiments.</p><p></p><p>If you have a song, musical idea, or pet progression that you would like to hear brought to life, bring it on in. A large band-facing projection screen for images or music is provided. Vocalists, horn players and all other instrumentalists very much invited. Come join the fun, or come to listen to the players decorate time.</p>
