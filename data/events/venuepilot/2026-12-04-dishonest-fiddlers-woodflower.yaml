description: <p>SRCC presents Tunes for Toys featuring Wood Flower with special guests The Dishonest Fiddlers!</p><p>Join us at Hempfield Apothetique for a night of live bluegrass, community, and giving back. This show kicks off our collaboration with Grateful Acres Productions to bring more bluegrass to the SRCC community!</p><p></p><p>Wood Flower and The Dishonest Fiddlers bring nimble picking, infectious energy, and plenty of heart to the stage. We’re thrilled to welcome such talented musicians and share their music with you!</p><p></p><p>Concertgoers are encouraged to bring a toy for donation to a local orphanage. More toy drive details will be shared in the coming weeks.</p><p></p><p>Friday, December 4, 2026<br>Hempfield Apothetique · 100 W. Walnut St., Lancaster, PA<br>Doors at 8 PM · Music at 8:30 PM<br>$15 advance · $20 at the door<br>21+ · $10 BYOB</p><p></p>
