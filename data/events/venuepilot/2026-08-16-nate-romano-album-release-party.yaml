description: <p>Our dear friend and fellow conspirator is FINALLY ready to release his newest album, which has been in the making for 25 years! Okay, maybe not that long—but this is still exciting.</p><p>Nate will be blowing minds with the wild acoustic contraption he calls a guitar, as well as sharing the stage with some of his closest musical homies. This is shaping up to be more of a party than a show, and we are here for it!</p><p>The night will also feature performances by Paige Romano (yup, Nate’s very own offspring), Lucid Ruby, The Screaming Eyeballs, Appaloosa Way, and Leeahna Eve.</p><p></p><p>There is a suggested $10 donation to help support SRCC Studios, which can be made through the ticketing link.</p><p></p><p></p><p></p><p><br></p><p></p>
