description: <p>Our dear friend and fellow conspirator is FINALLY ready to release his newest album, which has been in the making for 25 years! Okay, maybe not that long—but this is still exciting.</p><p>Nate will be blowing minds with the wild acoustic contraption he calls a guitar, as well as sharing the stage with some of his closest musical homies. This is shaping up to be more of a party than a show, and we are here for it!</p><p>The night will also feature performances by Paige Romano (yup, Nate’s very own offspring), Lucid Ruby, The Screaming Eyeballs, Appaloosa Way, and Leeahna Eve.</p><p>There is a suggested $10 donation to help support SRCC Studios, which can be made through the ticketing link.</p><p>Susquehanna River Creative Conspiracy is a 501(c)(3) nonprofit studio and venue in Columbia, PA, dedicated to “elevating community by facilitating creative endeavors and welcoming all to find inspiration and connection in the process.”</p><p>SRCC offers affordable, fully equipped music and art studio space—and more! Join us for Open Studio Night every Tuesday from 7–10 p.m.</p><p></p><p><br></p><p></p>
