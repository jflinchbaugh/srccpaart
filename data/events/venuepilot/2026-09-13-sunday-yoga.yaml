description: <p>🧘‍♀️ <strong>Sunday Yoga • 10 AM</strong></p><p></p><p>Join us every Sunday at 10 AM for a welcoming yoga class led by <strong>Kendra and Elise</strong>, alternating each week. Special music guest <strong>Nate Romano</strong> will join us with his handpan, creating the perfect sounds and vibes to accompany your practice.</p><p></p><p>Spaces are limited, reserve your spot today!</p><p></p><p><strong>$10 admission • Every Sunday • 10 AM</strong></p><p></p><p>Come stretch, breathe, move, and start your Sunday grounded. ✨</p><p></p><p>This weekly class supports <strong>Susquehanna River Creative Conspiracy’s mission of bridging creatives to community.</strong> Your participation helps keep studio spaces, performances, and creative resources accessible to local artists and makers. 🎨</p>
