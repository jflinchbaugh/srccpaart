description: '<p><strong><span style="color: rgb(255, 255, 255)">PREPARE FOR LIFTOFF: MUSCLE TOUGH IS COMING TO HEMPFIELD APOTHETIQUE</span></strong></p><p><br></p><p><em><span style="color: rgb(255, 255, 255)">On December 5, Muscle Tough will perform at Lancaster’s newest, coolest venue. They will be joined by Lady King &amp; The Aces— who last rocked out at The Lounge at Hempfield Apothetique in April of 2026.&nbsp;</span></em></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Muscle Tough is returning to Lancaster, and this time… they’re coming to THE LOUNGE AT HEMPFIELD APOTHETIQUE!!!&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">If you haven’t heard of Muscle Tough yet, you just might want to drop in for a one-of-a-kind night of live music at one of PA’s only legal cannabis consumption lounges.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Muscle Tough describes themselves as, “Philadelphia’s premier Futuristic Funk Fusion Trio, specializing in a heavily improvised blend of modal jazz, funk, and rocking psychedelia.”&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Lady King &amp; The Aces will open up the show. Lady King &amp; The Aces first played The Lounge in April of 2026. Their performance with Muscle Tough will be their second-ever concert at Hempfield Apothetique.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">The doors open at 7:00 at Hempfield Apothetique in Lancaster, presented by SRCC— supporting local art, music, and creative community along the Susquehanna.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Hempfield Apothetique is one of the only cannabis consumption lounges in the state, so get ready to get </span><em><span style="color: rgb(255, 255, 255)">elevated.</span></em><span style="color: rgb(255, 255, 255)"> Must be 21 years of age or older to attend.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">$17 tickets. Come appreciate local live art. Feel the vibe. Join the conspiracy.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Susquehanna River Creative Conspiracy is a 501(c)(3) nonprofit studio &amp; venue in Columbia, PA, dedicated to “Elevating community through the arts.” SRCC offers affordable fully equipped music and art studio space and more. Open studio nights every Tuesday, 7–10 pm.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Join the conspiracy! </span><a target="_blank" rel="noopener noreferrer nofollow" href="http://SRCCPAART.ORG"><span style="color: rgb(255, 255, 255)">SRCCPAART.ORG</span></a><span style="color: rgb(255, 255, 255)">.</span></p><p><br></p>'
