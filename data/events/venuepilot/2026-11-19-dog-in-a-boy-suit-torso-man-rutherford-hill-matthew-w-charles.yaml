description: '<p><span style="color: rgb(0, 0, 0);"><strong>Dog In a Boy Suit, TORSO MAN, Rutherford Hill and Matthew W. Charles to Rock Out at SRCC on Nov. 19</strong></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);"><em>Get ready for a Thursday night party, featuring four unique bands at SRCC.&nbsp;</em></span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Dog In a Boy Suit— melancholic weirdo country from Lancaster, Pa— will be headlining the show. Don’t miss these locals, who will be playing SRCC for the first time.&nbsp;</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Before DIBS is TORSO MAN, who blends acoustic emo and alt-country. TORSO MAN hails from Baltimore, MD.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Rutherhill Hill will also be representing central Pa with their alt-folk and indie pop sounds.&nbsp;</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">And finally we have Matthew W. Charles— a punk rock troubadour based out of Philadelphia, Pa.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Come on out for a Thursday Night Throwdown at SRCC!&nbsp;</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">The doors open at 6:00 at SRCC— supporting local art, music, and creative community along the Susquehanna.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">$15 tickets. Come appreciate local live art. Feel the vibe. Join the conspiracy.&nbsp;</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Susquehanna River Creative Conspiracy is a 501(c)(3) nonprofit studio &amp; venue in Columbia, PA, dedicated to “bridging creatives to community.” SRCC offers affordable fully equipped music and art studio space and more. Open studio nights every Tuesday, 7–10 pm.</span></p><p><br></p><p><span style="color: rgb(0, 0, 0);">Join the conspiracy! </span><a target="_blank" rel="noopener noreferrer nofollow" href="http://SRCCPAART.ORG"><span style="color: rgb(0, 0, 0);">SRCCPAART.ORG</span></a><span style="color: rgb(0, 0, 0);">.</span></p><p><br><br></p>'
