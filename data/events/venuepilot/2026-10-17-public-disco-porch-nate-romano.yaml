description: '<p><strong><span style="color: rgb(255, 255, 255)">PUBLIC DISCO PORCH: SRCC, OCTOBER 17</span></strong></p><p><em><span style="color: rgb(255, 255, 255)">Public Disco Porch is coming to SRCC on October 17. Nata Romano, and an opener to be named, will be opening up the show.&nbsp;</span></em></p><p><span style="color: rgb(255, 255, 255)">York ensemble Public Disco Porch is coming to SRCC on Oct. 17.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Public Disco Porch devotes their music to the exploration of the soil that lies underneath their feet. The land, and the people that walked it previously are at the forefront of the band’s narrative. The music itself acts as a rattling excavation of historical artifacts, culminating in an unhinged spiritual sound. The catalog is ripe with folk-metal riffage, entrancing percussion, muscular low-end, and just enough lashings of precise lead guitar.</span></p><p><span style="color: rgb(255, 255, 255)">​</span></p><p><span style="color: rgb(255, 255, 255)">It''s madness, hand in hand with absolute joy, dug up from the woods of South Central Pennsylvania.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Nate Romano, who just released his second album, will be opening up the show. Romano’s mastery of finger-style is a wonder to revel in. His sonic force is so great that you just might forget you’re hearing just one person.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">The event takes place at 7:00 at Susquehanna River Creative Conspiracy (SRCC) — supporting local art, music, and creative community along the Susquehanna.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">$15 tickets. Come appreciate local live music. Feel the vibe. Join the conspiracy.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Susquehanna River Creative Conspiracy is a 501(c)(3) nonprofit studio &amp; venue in Columbia, PA, dedicated to “Elevating community through the arts.” SRCC offers affordable fully equipped music and art studio space and more. Open studio nights every Tuesday, 7–10 pm.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Join the conspiracy! </span><a target="_blank" rel="noopener noreferrer nofollow" href="http://SRCCPAART.ORG"><span style="color: rgb(255, 255, 255)">SRCCPAART.ORG</span></a><span style="color: rgb(255, 255, 255)">.</span></p><p><br></p>'
