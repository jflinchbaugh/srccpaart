description: '<p><strong><span style="color: rgb(255, 255, 255)">PUNK NIGHT AT HEMPFIELD APOTHETIQUE</span></strong></p><p><em><span style="color: rgb(255, 255, 255)">One night, three bands. On September 19th Proper Spirit, Sharp Darts and Future Casualties will be throwing down at Hempfield Apothetique in Lancaster.&nbsp;</span></em></p><p><span style="color: rgb(255, 255, 255)">If you like punk, you’re not going to want to miss this show— which features three preeminent local punk acts.&nbsp;</span></p><p><span style="color: rgb(255, 255, 255)">Proper Spirit is headlining the show. Proper Spirit is an emo-shoegaze band from Lancaster, PA. Influenced by the likes of Slowdive, Nothing, Dinosaur Jr, Beach Fossils, LVLUP, existential dread, and growing anxieties each moment they awake, the three-piece intends to release their first single pending review in 2026 quarter 3 or quarter 4, then a collection of collaboratively-written songs in early 2027.</span></p><p><span style="color: rgb(255, 255, 255)">Preceding Proper Spirit is Sharp Darts, who draw influence from pivotal BANDS in the 90s; including Smashing Pumpkins, Sunny Day Real Estate and Nirvana. The group features fuzzy, loud and melancholic guitars, pounding, groovy drums, swelling bass, and dreamy vocals. 2021 saw the release of the groups first self titled EP, featuring local favorites like "Ashes" and "Old Clothes.” In the Summer of 2023, the group released their second EP, titled&nbsp; "Another Night With the Dead" featuring tracks like "sleep on fire" and "Plot Holes".</span></p><p><span style="color: rgb(255, 255, 255)">Future Casualties will kick off the night. Future Casualties was born out of three friends from the Lancaster music scene who decided the world needed more riffs and less rules. The band is a power trio blending technical chops with raw, loud energy. Future Casualties is quickly earning a reputation for their high-energy live shows and hook-laden original songs. Their sound mixes face-melting riffs, heady, pun-driven lyrics, and a psychedelic edge that’s equal parts chaos and control.&nbsp;</span></p><p><span style="color: rgb(255, 255, 255)">The doors open at 7:00 at Hempfield Apothetique in Lancaster, presented by SRCC— supporting local art, music, and creative community along the Susquehanna.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Hempfield Apothetique is one of the only cannabis consumption lounges in the state, so get ready to get </span><em><span style="color: rgb(255, 255, 255)">elevated.</span></em><span style="color: rgb(255, 255, 255)"> Must be 21 years of age or older to attend.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">$15 tickets. Come appreciate local live art. Feel the vibe. Join the conspiracy.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Susquehanna River Creative Conspiracy is a 501(c)(3) nonprofit studio &amp; venue in Columbia, PA, dedicated to “Elevating community through the arts.” SRCC offers affordable fully equipped music and art studio space and more. Open studio nights every Tuesday, 7–10 pm.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Join the conspiracy! </span><a target="_blank" rel="noopener noreferrer nofollow" href="http://SRCCPAART.ORG"><span style="color: rgb(255, 255, 255)">SRCCPAART.ORG</span></a><span style="color: rgb(255, 255, 255)">.</span></p><p><br></p>'
