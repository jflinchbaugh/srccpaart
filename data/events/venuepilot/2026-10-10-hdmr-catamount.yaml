description: '<p><strong><span style="color: rgb(255, 255, 255)">HDMR RETURNS TO SRCC STUDIOS</span></strong></p><p><br></p><p><em><span style="color: rgb(255, 255, 255)">On October 10th, HDMR will play SRCC Studios for the second time. They will be joined by Catamount. If you like rock and roll, this is a night that can’t be missed!</span></em></p><p><br></p><p><span style="color: rgb(255, 255, 255)">HDMR is an alternative rock group based out of Elizabethtown, PA. The group has been playing out on various stages across Chester and Lancaster County since 2019. Their set list includes cover songs from groups such as Neil Young, Tom Petty, Red Hot Chili Peppers and many more. They will also be playing songs from HDMR’s self titled debut album that was released in June of 2025.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Catamount will be opening up the show.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">The event takes place at 6:00 at Susquehanna River Creative Conspiracy (SRCC) — supporting local art, music, and creative community along the Susquehanna.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">$15 tickets. Come appreciate local live music. Feel the vibe. Join the conspiracy.&nbsp;</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Susquehanna River Creative Conspiracy is a 501(c)(3) nonprofit studio &amp; venue in Columbia, PA, dedicated to “Elevating community through the arts.” SRCC offers affordable fully equipped music and art studio space and more. Open studio nights every Tuesday, 7–10 pm.</span></p><p><br></p><p><span style="color: rgb(255, 255, 255)">Join the conspiracy! </span><a target="_blank" rel="noopener noreferrer nofollow" href="http://SRCCPAART.ORG"><span style="color: rgb(255, 255, 255)">SRCCPAART.ORG</span></a><span style="color: rgb(255, 255, 255)">.</span></p><p><br><br><br></p>'
