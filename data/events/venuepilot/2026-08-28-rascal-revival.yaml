description: <p>Join us for a laid-back night of live music featuring Central PA’s Rascal Revival and Winter Parks, bringing rich musicianship, soulful grooves, and plenty of improvisational energy. Opening the show is rising New Jersey artist Seven7. Come light up, settle in, and enjoy an intimate night of music at our cannabis-friendly lounge.</p><p></p><p>Doors open at 7:00 at Hempfield Apothetique in Lancaster. The show is presented by SRCC— supporting local art, music, and creative community along the Susquehanna.</p><p></p><p></p><p>Hempfield Apothetique is one of the only cannabis consumption lounges in the state, so get ready to get elevated. Must be 21 years of age or older to attend.&nbsp;</p><p></p><p></p><p>$20 tickets. Come appreciate local live music. Feel the vibe. Join the conspiracy.&nbsp;</p><p></p><p></p><p>Susquehanna River Creative Conspiracy is a 501(c)(3) nonprofit studio &amp; venue in Columbia, PA, dedicated to "Elevating community by facilitating creative endeavors and welcoming all to find inspiration and connection in the process." SRCC offers affordable fully equipped music and art studio space and more. Open studio nights every Tuesday, 7–10 pm.</p><p></p><p></p><p>Join the conspiracy! SRCCPAART.ORG.</p><p></p>
